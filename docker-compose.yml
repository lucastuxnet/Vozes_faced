services:
  web:
    build: .
    image: vozes-faced:latest
    container_name: vozes-faced
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./dados/data.json:/app/data.json
      - ./dados/users.json:/app/users.json
      - ./dados/audio:/app/static/audio
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
