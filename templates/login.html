{% extends "base.html" %}
{% set is_admin = false %}
{% block title %}Login – Área Restrita{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-box">
    <div class="auth-icon" aria-hidden="true">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h2 class="auth-title">Área Restrita</h2>
    <p class="auth-subtitle">Acesso exclusivo para administradores do repositório</p>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Usuário</label>
        <input type="text" id="username" name="username" class="form-input"
               required autocomplete="username" aria-required="true">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Senha</label>
        <input type="password" id="password" name="password" class="form-input"
               required autocomplete="current-password" aria-required="true">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <p class="auth-back"><a href="{{ url_for('index') }}">← Voltar ao repositório público</a></p>
  </div>
</div>
{% endblock %}
